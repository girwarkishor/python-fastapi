[project]
name = "python-fastapi"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "wikipedia>=1.4.0",
]

[dependency-groups]
dev = [
    "black>=26.5.1",
    "fire>=0.7.1",
    "pylint>=4.0.8",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["test"]
addopts = "--cov=. --cov-report=term-missing"

[tool.coverage.run]
omit = ["test/*", ".venv/*"]
